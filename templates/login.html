{% extends "base.html" %}

{% block content %}
<div class="auth-container fade-in">
    <div class="auth-card">
        <h2>Welcome Back</h2>
        <p>Please enter your details to access personalized tracking and feedback.</p>

        <div class="tabs">
            <button class="tab-btn active" onclick="openTab('login')">Login</button>
            <button class="tab-btn" onclick="openTab('register')">Register</button>
        </div>

        <div id="login" class="tab-content active">
            <form action="{{ url_for('login') }}" method="POST">
                <input type="hidden" name="action" value="login">
                <div class="form-group">
                    <label for="login-email">Email Address</label>
                    <input type="email" id="login-email" name="email" required placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" name="password" required placeholder="Enter password">
                </div>
                <button type="submit" class="btn btn-primary btn-block">Log In</button>
            </form>
        </div>

        <div id="register" class="tab-content" style="display:none;">
            <form action="{{ url_for('login') }}" method="POST">
                <input type="hidden" name="action" value="register">
                <div class="form-group">
                    <label for="reg-name">Full Name</label>
                    <input type="text" id="reg-name" name="name" required placeholder="Your Name">
                </div>
                <div class="form-group">
                    <label for="reg-email">Email Address</label>
                    <input type="email" id="reg-email" name="email" required placeholder="name@example.com">
                </div>
                <div class="form-group">
                    <label for="reg-age">Age</label>
                    <input type="number" id="reg-age" name="age" required placeholder="Age">
                </div>
                <div class="form-group">
                    <label for="reg-gender">Gender</label>
                    <select id="reg-gender" name="gender" required>
                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="reg-password">Password</label>
                    <input type="password" id="reg-password" name="password" required placeholder="Create password">
                </div>
                <button type="submit" class="btn btn-secondary btn-block">Sign Up</button>
            </form>
        </div>
    </div>
</div>

<script>
    function openTab(tabName) {
        var i;
        var x = document.getElementsByClassName("tab-content");
        for (i = 0; i < x.length; i++) {
            x[i].style.display = "none";
            x[i].className = x[i].className.replace(" active", "");
        }

        document.getElementById(tabName).style.display = "block";
        document.getElementById(tabName).className += " active";

        var btns = document.getElementsByClassName("tab-btn");
        for (i = 0; i < btns.length; i++) {
            btns[i].className = btns[i].className.replace(" active", "");
        }
        event.currentTarget.className += " active";
    }
</script>
{% endblock %}
